# Broker MQTT riêng cho tủ — SEC-04, ADR-0008 (docs/01-overview/mqtt-contract.md § 4, § 6).
# File mật khẩu và ACL do docker-entrypoint.sh sinh lúc khởi động vào /mosquitto/run.

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

per_listener_settings false
allow_anonymous false
password_file /mosquitto/run/passwd
acl_file /mosquitto/run/acl
max_packet_size 262144

# Trong mạng Docker: iot-service vào tcp://mosquitto:1883. KHÔNG publish ra host.
listener 1883
protocol mqtt

# WebSocket cho Nginx: compose chỉ publish ra 127.0.0.1:9001 của VM; TLS do Nginx lo
# (wss://api.locker-drone.tech/mqtt — infra/azure/enable-mqtt-websocket.sh).
listener 9001
protocol websockets
