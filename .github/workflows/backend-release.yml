name: Backend Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: backend-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test services
        run: mvn -B clean verify

      - name: Package release artifacts
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARTIFACT_NAME="laundry-locker-microservices-${VERSION}.tar.gz"
          SBOM_NAME="backend-sbom-${VERSION}.cdx.json"
          CHECKSUM_NAME="laundry-locker-microservices-${VERSION}.sha256"

          tar \
            --exclude='./.git' \
            --exclude='./laundry-ms.zip' \
            -czf "/tmp/${ARTIFACT_NAME}" .

          cp target/classes/META-INF/sbom/application.cdx.json "/tmp/${SBOM_NAME}"

          (
            cd /tmp
            sha256sum "${ARTIFACT_NAME}" "${SBOM_NAME}" > "${CHECKSUM_NAME}"
          )

          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "sbom_name=${SBOM_NAME}" >> "$GITHUB_OUTPUT"
          echo "checksum_name=${CHECKSUM_NAME}" >> "$GITHUB_OUTPUT"

      - name: Attest release artifact provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            /tmp/${{ steps.package.outputs.artifact_name }}
            /tmp/${{ steps.package.outputs.sbom_name }}
            /tmp/${{ steps.package.outputs.checksum_name }}

      - name: Upload release build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-release-${{ github.ref_name }}
          path: |
            /tmp/${{ steps.package.outputs.artifact_name }}
            /tmp/${{ steps.package.outputs.sbom_name }}
            /tmp/${{ steps.package.outputs.checksum_name }}
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "/tmp/${{ steps.package.outputs.artifact_name }}" \
            "/tmp/${{ steps.package.outputs.sbom_name }}" \
            "/tmp/${{ steps.package.outputs.checksum_name }}" \
            --title "Backend ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
