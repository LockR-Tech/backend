name: Backend Security

# Chỉ chạy trên `main`, theo lịch tuần, và khi gọi tay.
#
# Trước đây chạy cả trên `pull_request` VÀ mọi push nhánh feat/fix/chore. Mỗi lần
# là 14 job quét container + CodeQL + SBOM, và mỗi PR bị chạy hai lượt (một cho
# push, một cho pull_request) ⇒ riêng repo này ngốn 97% quota Actions của org và
# làm hết sạch 2.000 phút giữa chu kỳ, chặn luôn cả deploy.
#
# Bỏ đi không mất lớp bảo vệ nào đang hoạt động: `dependency-review` và `codeql`
# đều hỏng trên repo này vì org chưa bật Dependency graph + Advanced Security.
# Cổng chặn merge thật sự là `backend-ci.yml` (mvn test) — vẫn giữ nguyên trên PR.
on:
  push:
    branches:
      - main
  schedule:
    - cron: "25 20 * * 0"
  workflow_dispatch:

concurrency:
  group: backend-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          fail-on-scopes: development, runtime

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin

      - name: Build for analysis
        run: mvn -B -DskipTests package

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4

  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate backend SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: backend-sbom.cdx.json

      - name: Upload backend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: backend-sbom-cyclonedx
          path: backend-sbom.cdx.json

  container-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module:
          - api-gateway
          - auth-service
          - discovery-server
          - user-service
          - order-service
          - locker-service
          - payment-service
          - notification-service
          - iot-service
          - store-service
          - loyalty-service
          - assistant-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package backend jars
        run: mvn -B -DskipTests package

      - name: Build image for scan
        run: |
          docker build \
            --build-arg MODULE=${{ matrix.module }} \
            -f ${{ matrix.module }}/Dockerfile \
            -t laundry-locker-${{ matrix.module }}:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: laundry-locker-${{ matrix.module }}:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
