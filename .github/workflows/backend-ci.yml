name: Backend CI

# `pull_request` là cổng chặn merge; push chỉ chạy trên `main` để bắt lỗi lọt qua.
#
# Trước đây còn chạy trên push nhánh feat/fix/chore/docs, nên mỗi PR bị test HAI
# lượt cho cùng một commit — tốn gấp đôi phút Actions mà không thêm thông tin gì.
# Nhánh chưa mở PR thì cũng chưa cần CI.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests
        run: mvn -B test
