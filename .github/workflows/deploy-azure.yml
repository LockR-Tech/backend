name: Deploy to Azure VM

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      # Sửa tài liệu không cần build lại và deploy lại — một lần chạy đầy đủ mất
      # khoảng 20 phút và thay cả bản đang chạy trên VM.
      - '**.md'                       # gồm luôn infra/azure/DEPLOY-LOG.md mà bước ghi
                                      # nhật ký tự commit — chốt chống vòng lặp thứ nhất
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: laundry-locker-microservices-azure
  cancel-in-progress: true

permissions:
  contents: write   # cần để commit infra/azure/DEPLOY-LOG.md
  id-token: write
  attestations: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test services
        run: mvn -B clean verify

      # Gói chỉ mang thứ VM thật sự cần: docker-compose.yml, các Dockerfile,
      # scripts/ và */target/*.jar (Dockerfile chỉ COPY jar, không build từ nguồn).
      #
      # Lưu ý về kích thước: gói vẫn ~860 MB vì 12 fat jar chiếm ~960 MB trước nén
      # (auth-service và notification-service mỗi cái >130 MB do firebase-admin).
      # Các exclude dưới đây chỉ cắt ~8 MB — phần còn lại là jar, không bỏ được.
      # Muốn giảm thật sự thì phải dùng Spring Boot layered jar + cache tầng
      # Docker, hoặc build image trong CI rồi push lên registry (ACR).
      - name: Package deploy artifact
        run: |
          tar \
            --exclude='./.git' \
            --exclude='./docs' \
            --exclude='*/target/classes' \
            --exclude='*/target/test-classes' \
            --exclude='*/target/generated-sources' \
            --exclude='*/target/generated-test-sources' \
            --exclude='*/target/maven-status' \
            --exclude='*/target/maven-archiver' \
            --exclude='*/target/surefire-reports' \
            --exclude='*/target/*.jar.original' \
            -czf /tmp/laundry-locker-microservices.tar.gz .
          sha256sum /tmp/laundry-locker-microservices.tar.gz \
            > /tmp/laundry-locker-microservices.tar.gz.sha256
          ls -lh /tmp/laundry-locker-microservices.tar.gz

      - name: Upload deploy artifact checksum
        uses: actions/upload-artifact@v4
        with:
          name: laundry-locker-microservices-deploy-checksum
          path: /tmp/laundry-locker-microservices.tar.gz.sha256
          retention-days: 14

      - name: Attest deploy artifact provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            /tmp/laundry-locker-microservices.tar.gz
            /tmp/laundry-locker-microservices.tar.gz.sha256

      - name: Configure SSH
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_SSH_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
        run: |
          test -n "$AZURE_VM_HOST"
          test -n "$AZURE_VM_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$AZURE_VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$AZURE_VM_HOST" >> ~/.ssh/known_hosts

      - name: Upload artifact
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
          AZURE_VM_PORT: ${{ secrets.AZURE_VM_PORT }}
        run: |
          test -n "$AZURE_VM_HOST"
          test -n "$AZURE_VM_USER"
          PORT="${AZURE_VM_PORT:-22}"
          scp -P "$PORT" -i ~/.ssh/deploy_key \
            /tmp/laundry-locker-microservices.tar.gz \
            /tmp/laundry-locker-microservices.tar.gz.sha256 \
            "$AZURE_VM_USER@$AZURE_VM_HOST:/tmp/"

      - name: Deploy on Azure VM
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
          AZURE_VM_PORT: ${{ secrets.AZURE_VM_PORT }}
        run: |
          PORT="${AZURE_VM_PORT:-22}"
          ssh -p "$PORT" -i ~/.ssh/deploy_key "$AZURE_VM_USER@$AZURE_VM_HOST" \
            'bash -s' < scripts/deploy-from-artifact.sh

      # Nghiệm thu qua đúng đường mà client đi (domain + TLS + Nginx + gateway),
      # chứ không chỉ tin vào việc container đã Up.
      - name: Nghiệm thu qua domain công khai
        id: verify
        if: success()
        run: |
          API=https://api.locker-drone.tech
          fail=0
          check() { # tên, url, mã mong đợi
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$2" || echo 000)
            if [ "$code" = "$3" ]; then echo "- ✅ $1 → $code"; else echo "- ❌ $1 → $code (mong đợi $3)"; fail=1; fi
          }
          {
            echo "### Nghiệm thu"
            check "Gateway health"        "$API/actuator/health" 200
            check "Danh sách tủ (public)" "$API/api/lockers"     200
            check "Admin API không token" "$API/api/admin/users" 401
            check "Đường vòng gateway"    "$API/user-service/api/admin/users" 404
          } > verify.md
          cat verify.md
          echo "failed=$fail" >> "$GITHUB_OUTPUT"
          exit $fail

      - name: Ghi tóm tắt vào trang Actions
        if: always()
        run: |
          {
            echo "## Deploy backend → Azure VM — ${{ job.status }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Nhánh | \`${{ github.ref_name }}\` |"
            echo "| Người đẩy | @${{ github.actor }} |"
            echo "| Thời điểm | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo "| API | https://api.locker-drone.tech |"
            echo ""
            [ -f verify.md ] && cat verify.md
            if [ "${{ job.status }}" != "success" ]; then
              echo ""
              echo "### Deploy THẤT BẠI — script đã tự rollback về bản \`.previous\`"
              echo "Nguyên nhân hay gặp:"
              echo "- \`mvn clean verify\` đỏ → xem bước Build and test services"
              echo "- SSH hỏng → kiểm tra secret \`AZURE_VM_HOST/USER/SSH_KEY\`, và NSG có mở cổng 22 không"
              echo "- Chờ Eureka quá hạn → một service không đăng ký được, xem \`docker compose logs discovery-server\` trên VM"
              echo "- Hết RAM lúc build image → \`free -h\` trên VM, swap 4 GB phải đang bật"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Nhật ký nằm ngay trong repo để theo dõi lịch sử deploy mà không cần mở tab Actions.
      - name: Ghi nhật ký deploy vào repo
        if: always()
        run: |
          LOG=infra/azure/DEPLOY-LOG.md
          mkdir -p infra/azure
          if [ ! -f "$LOG" ]; then
            {
              echo "# Nhật ký deploy — backend trên Azure"
              echo ""
              echo "Do workflow \`deploy-azure.yml\` tự ghi sau **mỗi** lần chạy, kể cả khi thất bại."
              echo "Bản ghi mới nhất nằm trên cùng."
              echo ""
              echo "| Thời điểm (UTC) | Kết quả | Commit | Người đẩy | Nghiệm thu |"
              echo "|---|---|---|---|---|"
            } > "$LOG"
          fi
          if [ "${{ job.status }}" = "success" ]; then
            NOTE="health 200 · public 200 · admin 401 · bypass 404"
          else
            NOTE="**THẤT BẠI** — [run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}); đã rollback"
          fi
          SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          ROW="| $(date -u '+%Y-%m-%d %H:%M') | ${{ job.status }} | [\`$SHORT\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) | @${{ github.actor }} | $NOTE |"
          awk -v row="$ROW" '/^\|---\|/ && !done { print; print row; done=1; next } { print }' "$LOG" > "$LOG.tmp" && mv "$LOG.tmp" "$LOG"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LOG"
          git diff --cached --quiet || git commit -m "chore(deploy): ghi nhật ký deploy backend [skip ci]"
          git push origin HEAD:${{ github.ref_name }} || echo "không push được nhật ký (nhánh có thể được bảo vệ) — bỏ qua"
