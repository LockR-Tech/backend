server:
  port: ${SERVER_PORT:8084}
spring:
  application:
    name: locker-service
  cloud:
    openfeign:
      circuitbreaker:
        enabled: ${SPRING_CLOUD_OPENFEIGN_CIRCUITBREAKER_ENABLED:true}
        group:
          enabled: ${SPRING_CLOUD_OPENFEIGN_CIRCUITBREAKER_GROUP_ENABLED:true}
      client:
        config:
          default:
            connectTimeout: ${APP_FEIGN_CONNECT_TIMEOUT_MS:2000}
            readTimeout: ${APP_FEIGN_READ_TIMEOUT_MS:5000}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/locker_db}
    username: ${SPRING_DATASOURCE_USERNAME:locker_user}
    password: ${SPRING_DATASOURCE_PASSWORD:locker_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: locker_schema
  flyway:
    enabled: true
    create-schemas: true
    schemas: locker_schema
    default-schema: locker_schema
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,sbom
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}

logging:
  pattern:
    level: "%5p [${spring.application.name:unknown},%X{correlationId:-}]"

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-size: ${APP_RESILIENCE4J_CB_SLIDING_WINDOW_SIZE:20}
        minimum-number-of-calls: ${APP_RESILIENCE4J_CB_MINIMUM_CALLS:10}
        failure-rate-threshold: ${APP_RESILIENCE4J_CB_FAILURE_RATE_THRESHOLD:50}
        wait-duration-in-open-state: ${APP_RESILIENCE4J_CB_WAIT_DURATION:30s}
        permitted-number-of-calls-in-half-open-state: ${APP_RESILIENCE4J_CB_HALF_OPEN_CALLS:3}
        slow-call-duration-threshold: ${APP_RESILIENCE4J_CB_SLOW_CALL_DURATION:4s}
        slow-call-rate-threshold: ${APP_RESILIENCE4J_CB_SLOW_CALL_RATE_THRESHOLD:80}
  # Force-open goes locker -> iot-service, which blocks up to 20s waiting for
  # the cabinet's MQTT reply. The Resilience4j default TimeLimiter (1s) would
  # kill that call before the hardware answers, so give Feign calls headroom.
  timelimiter:
    configs:
      default:
        timeout-duration: ${APP_RESILIENCE4J_TL_TIMEOUT:25s}
        cancel-running-future: true
