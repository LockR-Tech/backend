server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: order-service
  cloud:
    openfeign:
      circuitbreaker:
        enabled: ${SPRING_CLOUD_OPENFEIGN_CIRCUITBREAKER_ENABLED:true}
        group:
          enabled: ${SPRING_CLOUD_OPENFEIGN_CIRCUITBREAKER_GROUP_ENABLED:true}
      client:
        config:
          default:
            connectTimeout: ${APP_FEIGN_CONNECT_TIMEOUT_MS:2000}
            readTimeout: ${APP_FEIGN_READ_TIMEOUT_MS:5000}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/order_db}
    username: ${SPRING_DATASOURCE_USERNAME:order_user}
    password: ${SPRING_DATASOURCE_PASSWORD:order_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: order_schema
  flyway:
    enabled: true
    create-schemas: true
    schemas: order_schema
    default-schema: order_schema
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,sbom
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}

logging:
  pattern:
    level: "%5p [${spring.application.name:unknown},%X{correlationId:-}]"

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-size: ${APP_RESILIENCE4J_CB_SLIDING_WINDOW_SIZE:20}
        minimum-number-of-calls: ${APP_RESILIENCE4J_CB_MINIMUM_CALLS:10}
        failure-rate-threshold: ${APP_RESILIENCE4J_CB_FAILURE_RATE_THRESHOLD:50}
        wait-duration-in-open-state: ${APP_RESILIENCE4J_CB_WAIT_DURATION:30s}
        permitted-number-of-calls-in-half-open-state: ${APP_RESILIENCE4J_CB_HALF_OPEN_CALLS:3}
        slow-call-duration-threshold: ${APP_RESILIENCE4J_CB_SLOW_CALL_DURATION:4s}
        slow-call-rate-threshold: ${APP_RESILIENCE4J_CB_SLOW_CALL_RATE_THRESHOLD:80}

app:
  # Quy tắc nghiệp vụ admin cấu hình được (ADR-0005) — /api/admin/settings/order.
  settings:
    scope: order
  security:
    qr-secret: ${APP_SECURITY_QR_SECRET:laundry-locker-dev-qr-secret-change-me-32chars}
  drone:
    demo:
      enabled: ${APP_DRONE_DEMO_ENABLED:true}
      allowed-user-ids: ${APP_DRONE_DEMO_ALLOWED_USER_IDS:}
      source-locker-id: ${APP_DRONE_DEMO_SOURCE_LOCKER_ID:1}
      stage-delay-ms: ${APP_DRONE_DEMO_STAGE_DELAY_MS:3000}
      scheduler-delay-ms: ${APP_DRONE_DEMO_SCHEDULER_DELAY_MS:1000}
    # Telemetry drone thật qua MQTT (đơn STANDARD) — docs/01-overview/drone-telemetry-contract.md.
    # Tắt mặc định; bật thì phải có secret ký bản tin hoặc tài khoản broker riêng.
    telemetry:
      enabled: ${APP_DRONE_TELEMETRY_ENABLED:false}
      broker-url: ${DRONE_MQTT_BROKER_URL:${MQTT_BROKER_URL:tcp://broker.hivemq.com:1883}}
      client-id: ${DRONE_MQTT_CLIENT_ID:lockr-order-drone-telemetry}
      username: ${DRONE_MQTT_USERNAME:}
      password: ${DRONE_MQTT_PASSWORD:}
      # Khoá gốc: khoá của từng drone = HMAC-SHA256(secret, "lockr-drone:" + mã drone).
      secret: ${DRONE_TELEMETRY_SECRET:}
      max-clock-skew-seconds: ${APP_DRONE_TELEMETRY_MAX_CLOCK_SKEW_SECONDS:120}
      # Quá số giây này không có bản tin ⇒ coi như mất tín hiệu.
      live-window-seconds: ${APP_DRONE_TELEMETRY_LIVE_WINDOW_SECONDS:15}
      # Ngưỡng suy ra chặng bay từ vị trí (mét).
      departed-distance-m: ${APP_DRONE_TELEMETRY_DEPARTED_DISTANCE_M:30}
      approach-distance-m: ${APP_DRONE_TELEMETRY_APPROACH_DISTANCE_M:150}
      arrival-radius-m: ${APP_DRONE_TELEMETRY_ARRIVAL_RADIUS_M:30}
